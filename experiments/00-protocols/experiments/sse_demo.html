<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server-Sent Events demo</title>
  <h1>Server-Sent Events</h1>
  <p id="status" role="status">Connecting…</p>
  <ol id="events" aria-live="polite"></ol>
  <script>
    const status = document.querySelector("#status");
    const events = document.querySelector("#events");
    const source = new EventSource("/events");

    source.onopen = () => {
      status.textContent = "Connected — waiting for events";
    };

    source.addEventListener("update", (event) => {
      const item = document.createElement("li");
      item.textContent = `id=${event.lastEventId}: ${event.data}`;
      events.append(item);

      status.textContent = "Receiving events…";
    });

    source.addEventListener("done", () => {
      status.textContent = "Stream complete";
      source.close();
    });

    source.onerror = () => {
      status.textContent = source.readyState === EventSource.CONNECTING
        ? "Connection interrupted — EventSource will reconnect"
        : "Connection closed";
    };
  </script>
</html>
