# Two ways to put a load balancer in front of the same two backends.
#   :8080  L7 (HTTP) proxy: nginx terminates the client connection, parses each
#          request, and picks an upstream per request. Speaks HTTP/2 to the client,
#          HTTP/1.1 to the backends.
#   :8081  L4 (TCP) proxy: nginx forwards bytes; one client connection maps to one
#          backend connection for its whole life.
events {}

http {
  # max_fails=0: never mark a backend down, so the routing stays visible even if one
  # request fails during startup.
  upstream backends { server backend1:8000 max_fails=0; server backend2:8000 max_fails=0; }
  server {
    listen 8080;
    http2 on;
    location / {
      proxy_pass http://backends;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header X-Upstream $upstream_addr always;
    }
  }
}

stream {
  upstream tcp_backends { server backend1:8000 max_fails=0; server backend2:8000 max_fails=0; }
  server { listen 8081; proxy_pass tcp_backends; }
}
